[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmagix"
version = "0.1.0"
description = "A fast 2D cross-embodiment imitation benchmark on MuJoCo Warp (x-magical successor)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0", "mujoco>=3.16.0", "jax>=0.12.0", "gymnasium>=1.0",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.12.0", "mujoco-warp>=3.16.0", "warp-lang>=1.18.0"]

[dependency-groups]
dev = ["pytest>=8", "pillow>=10"]

[tool.ruff]
line-length = 110
target-version = "py312"
